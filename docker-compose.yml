services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: always
    volumes:
      - ${OLLAMA_DATA_FOLDER:-./ollama_data}:/root/.ollama
    devices:
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_VULKAN=1
      - OLLAMA_NUM_GPU=999
    group_add:
      - video
      - ${RENDER_GROUP_ID}
    # Instalar o pacote 'nvidia-cg-toolkit' no host e descomentar:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      external:
        ipv4_address: ${OLLAMA_IP}

networks:
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}